<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Dashboard do Síndico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded shadow">
            <h1 class="text-xl font-bold">Gestão de Chamados - Síndico</h1>
            <a href="/logout" class="text-red-500 font-semibold">Sair</a>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-bold mb-4">Todos os Chamados do Condomínio</h2>
            <div class="space-y-4">
                {% for c in chamados %}
                <div class="border p-4 rounded flex justify-between items-center bg-gray-50">
                    <div>
                        <span class="font-bold text-blue-600">Unidade {{ c.usuario.unidade }}</span>: {{ c.titulo }}
                        <p class="text-gray-600 text-sm">{{ c.descricao }}</p>
                    </div>
                    <form action="/chamado/{{ c.id }}/status" method="POST" class="flex items-center space-x-2">
                        <select name="status" class="p-2 border rounded text-sm">
                            <option value="Pendente" {% if c.status == 'Pendente' %}selected{% endif %}>Pendente</option>
                            <option value="Em Andamento" {% if c.status == 'Em Andamento' %}selected{% endif %}>Em Andamento</option>
                            <option value="Resolvido" {% if c.status == 'Resolvido' %}selected{% endif %}>Resolvido</option>
                        </select>
                        <button type="submit" class="bg-blue-600 text-white px-3 py-2 rounded text-sm">Atualizar</button>
                    </form>
                </div>
                {% else %}
                <p class="text-gray-500">Nenhum chamado registado.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
