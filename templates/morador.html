<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Área do Morador</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded shadow">
            <h1 class="text-xl font-bold">Painel do Morador (Unidade {{ session['unidade'] }})</h1>
            <a href="/logout" class="text-red-500 font-semibold">Sair</a>
        </div>
        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-lg font-bold mb-4">Abrir Novo Chamado</h2>
            <form method="POST">
                <div class="mb-4">
                    <input type="text" name="titulo" placeholder="Título da ocorrência" required class="w-full p-2 border rounded">
                </div>
                <div class="mb-4">
                    <textarea name="descricao" placeholder="Descreva o problema..." required class="w-full p-2 border rounded h-24"></textarea>
                </div>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Enviar Chamado</button>
            </form>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-bold mb-4">Meus Chamados</h2>
            <div class="space-y-4">
                {% for c in chamados %}
                <div class="border p-4 rounded flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-gray-800">{{ c.titulo }}</h3>
                        <p class="text-gray-600 text-sm">{{ c.descricao }}</p>
                    </div>
                    <span class="px-3 py-1 rounded text-sm font-semibold bg-yellow-100 text-yellow-800">{{ c.status }}</span>
                </div>
                {% else %}
                <p class="text-gray-500">Nenhum chamado aberto ainda.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
